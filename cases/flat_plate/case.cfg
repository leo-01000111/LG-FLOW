# LG-Flow — Flat Plate Boundary Layer (SA turbulence model)
# Re = U*L/nu = 1.0 * 0.5 / (5e-5) = 10000
# Flow over a flat plate: bottom=WALL, left=INLET, right=OUTLET, top=SYMMETRY

mesh.Nx = 64
mesh.Ny = 32
mesh.Lx = 1.0
mesh.Ly = 0.2

solver.dt        = 0.005
solver.max_iter  = 3000
solver.tolerance = 1e-5
solver.rho       = 1.0
solver.nu        = 5e-5
solver.alpha_u   = 0.7
solver.alpha_p   = 0.3
solver.convection_scheme = upwind
solver.turbulence = SA
solver.sa.alpha_nu = 0.7
solver.sa.nu_tilde_freestream = 1.5e-4

bc.left.type    = INLET
bc.left.value_x = 1.0
bc.right.type   = OUTLET
bc.bottom.type  = WALL
bc.top.type     = SYMMETRY

output.vtk_interval = 200
output.dir = output/flat_plate
