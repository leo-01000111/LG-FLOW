# LG-Flow — Poiseuille Channel Flow Validation (Re = 100)
#
# Fully developed laminar channel flow between two parallel plates.
# Analytical solution (Poiseuille): u(y) = 6·U_avg·(y/H)·(1 - y/H)
#   U_avg = 1.0 m/s  → u_max = 1.5 m/s at centreline (y = H/2)
#
# Validation: compare centreline u-velocity profile with analytical solution.
# Expected: u_max ≈ 1.5 at x = Lx (fully developed region).
#
# Re = U_avg * H / nu = 1.0 * 1.0 / 0.01 = 100
# Reference: White (2006) "Fluid Mechanics", §6-2.

# Mesh: 64 cells in x (stream), 16 cells in y (cross-stream)
mesh.Nx  = 64
mesh.Ny  = 16
mesh.Lx  = 4.0
mesh.Ly  = 1.0

# Time stepping — implicit viscous term allows larger dt than explicit.
solver.dt          = 0.05
solver.max_iter    = 3000
solver.tolerance   = 1e-5

# Convection scheme: upwind for robustness at Re=100.
solver.convection_scheme = upwind

# CFL limits (convective CFL active; diffusive limit lifted by implicit viscous).
solver.max_cfl_conv = 0.5
solver.max_cfl_diff = 10.0

# Fluid properties
solver.rho = 1.0
solver.nu  = 0.01

# Under-relaxation
solver.alpha_u = 0.7
solver.alpha_p = 0.3

# Boundary conditions
# left  = INLET:  uniform u = (1, 0) m/s
# right = OUTLET: zero-gradient velocity, p = 0 reference
# top/bottom = no-slip walls
bc.left.type    = INLET
bc.left.value_x = 1.0
bc.left.value_y = 0.0
bc.right.type   = OUTLET
bc.top.type     = WALL
bc.bottom.type  = WALL

# Output
output.vtk_interval = 200
output.dir          = output/channel_flow
