# LG-Flow — Poiseuille Channel Validation with Grid Refinement (Re_H = 100)
#
# Uniform inflow develops into plane Poiseuille flow between two walls:
#   u(y) = 6·U·(y/H)·(1 − y/H),  u_max = 1.5·U,  Q = U·H
# Reference: White (2006) "Fluid Mechanics" §6-2.
#
# Used by tests/validation/test_poiseuille_channel.cpp (CTest PoiseuilleChannel).
# The test overrides mesh.Nx, mesh.Ny and mesh.Lx per refinement level:
#   Ny = validation.base_ny · 2^level,  dx = validation.aspect_ratio · dy,
#   Lx = validation.entrance_length_factor · L_e, rounded up to whole coarse cells,
#   L_e from Chen (1973) for parallel plates, Re based on D_h = 2H.

# Mesh (Ly = H; Nx/Lx/Ny are set by the test per level)
mesh.Ly  = 1.0

# Fluid: Re_H = U·H/ν = 1.0·1.0/0.01 = 100
solver.rho = 1.0
solver.nu  = 0.01

# Pseudo-time stepping; the convective CFL clamp sets the effective step.
solver.dt          = 1.0
solver.max_iter    = 200000
solver.convection_scheme = upwind
solver.max_cfl_conv = 0.5
solver.max_cfl_diff = 10.0

# Convergence: tight enough that the iteration error stays well below the
# discretisation error on the finest level, so the observed order is meaningful.
solver.tolerance            = 1e-8
solver.tolerance_continuity = 1e-6

# Under-relaxation
solver.alpha_u = 0.7
solver.alpha_p = 0.3

# Boundary conditions: uniform inlet, outlet, no-slip walls at y = 0 and y = H
bc.left.type    = INLET
bc.left.value_x = 1.0
bc.left.value_y = 0.0
bc.right.type   = OUTLET
bc.top.type     = WALL
bc.bottom.type  = WALL

# Output (history.csv only; no VTK snapshots during validation)
output.vtk_interval = 1000000
output.dir          = output/channel_validate

# ── Validation parameters ────────────────────────────────────────────────────
# Lx = factor · L_e (entrance length)
validation.entrance_length_factor = 3.0
# Profile station at x = sample_fraction · Lx
validation.sample_fraction = 0.9
# Coarsest level: Ny cells across H, cell aspect ratio dx/dy
validation.base_ny = 8
validation.aspect_ratio = 4.0
# Always run at least this many levels; more only within the time budget
# (environment variable LGFLOW_VALIDATION_BUDGET_S, default 1800 s)
validation.min_levels = 3
# |Q(x) − U·H| / (U·H) allowed at the developed stations on every level, and at
# x = 1 H on the finest level (measured 2026-10-27: 1.2e-5 at Ny = 32)
validation.max_q_error = 1e-3
# Observed order of accuracy of the finest pair must lie in [min, max]
# (measured 2026-10-27: 1.94, 1.96, 1.92 for Ny 8→16, 16→32, 32→64)
validation.min_order = 1.75
validation.max_order = 3.0
# Finest-level RMSE of u(y) relative to u_max
# (measured 2026-10-27: 6.8e-4 at Ny = 32, 1.8e-4 at Ny = 64)
validation.max_rel_rmse = 2e-3
