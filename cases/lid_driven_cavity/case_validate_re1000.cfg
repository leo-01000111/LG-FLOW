# LG-Flow — Lid-Driven Cavity Validation Config, Re = 1000
# Semi-implicit SIMPLE with implicit viscous term and Rhie-Chow face
# interpolation; same solver settings as case_validate.cfg (Re = 100).
#
# Reference: Ghia et al. (1982) Re=1000, Tables I and II.
# Used by CTest GhiaRe1000 (lgflow_validate_lid, exit code 2 on threshold failure).
#
# Upwind convection, measured 2026-10-27 (Release, MSVC):
#   mesh     u_l2   v_l2   iterations  time
#   32x32    0.172  0.212   4402         35 s
#   64x64    0.103  0.124   5111        200 s   <- this config
#   128x128  0.063  0.070   9616       2371 s
# The error falls by about 1.7x per refinement: first-order upwind diffusion
# dominates at Re = 1000. Central differencing diverges at 64x64 (cell Peclet
# number U*dx/nu = 16 > 2), so it is not usable here.

# Mesh
mesh.Nx  = 64
mesh.Ny  = 64
mesh.Lx  = 1.0
mesh.Ly  = 1.0

# Time stepping; the convective CFL clamp sets the effective step.
solver.dt          = 0.01
solver.max_iter    = 20000
solver.tolerance   = 1e-5
# Relative continuity residual ||div u*|| / R_0 (R_0 = max of first 5 steps).
# run() stops only when both tolerances are met.
solver.tolerance_continuity = 1e-4

# Convection scheme: upwind (central diverges at this mesh, see above)
solver.convection_scheme = upwind

solver.max_cfl_conv = 0.5
solver.max_cfl_diff = 10.0

# Fluid properties (Re = U*L/nu = 1.0*1.0/0.001 = 1000)
solver.rho = 1.0
solver.nu  = 0.001

# Under-relaxation
solver.alpha_u = 0.7
solver.alpha_p = 0.3

# Boundary conditions: moving lid on top, no-slip walls elsewhere
bc.top.type    = WALL
bc.top.value   = 1.0
bc.bottom.type = WALL
bc.left.type   = WALL
bc.right.type  = WALL

# Output (no VTK snapshots during validation)
output.vtk_interval = 1000000
output.dir          = output/lid_driven_cavity_re1000

# Validation: reference data and thresholds (~45% headroom over 64x64 upwind)
validation.reference         = cases/lid_driven_cavity/ghia1982_re1000.csv
validation.max_u_l2          = 0.15
validation.max_v_l2          = 0.18
# Final relative continuity residual (measured 1.1e-5); fails a run that
# stopped at max_iter without converging.
validation.max_cont_residual = 1e-4
