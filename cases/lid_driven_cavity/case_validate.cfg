# LG-Flow — Lid-Driven Cavity Validation Config (Phase 10 / implicit)
# Semi-implicit SIMPLE with implicit viscous term (MomentumSolver) and
# Rhie-Chow face interpolation (PressureSolver).
#
# Implicit viscous term removes the diffusive CFL constraint:
#   dt is no longer limited by 0.5 * dx^2 / nu.
# dt = 0.01 gives a 10x larger step than the old explicit config (dt=0.001).
#
# Reference: Ghia et al. (1982) Re=100 benchmark.
# NOTE: 32x32 is coarser than Ghia's 129x129; error metrics will be ~O(dx).

# Mesh
mesh.Nx  = 32
mesh.Ny  = 32
mesh.Lx  = 1.0
mesh.Ly  = 1.0

# Time stepping — larger dt is stable with implicit viscous term.
solver.dt          = 0.01
solver.max_iter    = 2000
solver.tolerance   = 1e-5

# Convection scheme: upwind (donor-cell) for robustness.
# Switch to 'central' for 2nd-order accuracy once convergence is confirmed.
solver.convection_scheme = upwind

# CFL safety: convective limit remains; diffusive limit is no longer active
# because the viscous term is handled implicitly.
solver.max_cfl_conv = 0.5
solver.max_cfl_diff = 10.0

# Fluid properties (Re = U*L/nu = 1.0*1.0/0.01 = 100)
solver.rho = 1.0
solver.nu  = 0.01

# Under-relaxation
solver.alpha_u = 0.7
solver.alpha_p = 0.3

# Boundary conditions: moving lid on top, no-slip walls elsewhere
bc.top.type    = WALL
bc.top.value   = 1.0
bc.bottom.type = WALL
bc.left.type   = WALL
bc.right.type  = WALL

# Output
output.vtk_interval = 100
output.dir          = output/lid_driven_cavity

# Validation thresholds (Ghia 1982 Re=100, 32x32 upwind baseline)
# Measured: u_l2=0.071, v_l2=0.037 — thresholds set with ~40% headroom.
validation.max_u_l2 = 0.10
validation.max_v_l2 = 0.06
