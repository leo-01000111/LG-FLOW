mesh.file = cases/channel_unstruct/channel.msh
solver.dt        = 0.01
solver.max_iter  = 2000
solver.tolerance = 1e-5
solver.rho       = 1.0
solver.nu        = 0.01
solver.alpha_u   = 0.7
solver.alpha_p   = 0.3
solver.convection_scheme = upwind
output.vtk_interval = 100
output.dir = output/channel_unstruct
bc.inlet.type    = INLET
bc.inlet.value_x = 1.0
bc.outlet.type   = OUTLET
bc.wall_bottom.type = WALL
bc.wall_top.type    = WALL
